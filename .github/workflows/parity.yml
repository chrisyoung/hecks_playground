name: Parity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "**"]

jobs:
  parity:
    name: Ruby DSL ↔ Rust storehouse
    runs-on: ubuntu-latest

    # Multi-repo layout — same shape as test.yml. The Rust specializer
    # for `system_prompt` reads from `<hecks-root>/../miette/self/...`
    # ; checking out miette as a sibling under $GITHUB_WORKSPACE makes
    # `../miette` resolve correctly from the cloned hecks dir. Without
    # this, the rust_specializer_produces_byte_identical_system_prompt_rs
    # cargo test panics with "cannot read shape ... No such file or
    # directory" because miette isn't checked out.
    steps:
      - name: Checkout hecks
        uses: actions/checkout@v4
        with:
          path: hecks

      - name: Checkout miette (sibling, optional)
        # chrisyoung/miette is PRIVATE ; the default workflow GITHUB_TOKEN
        # is scoped to this (public) hecks repo and gets "Not Found" on it,
        # which would otherwise fail the whole job at the checkout step.
        # The only parity step that reads ../miette is the
        # system_prompt specializer golden, which skips gracefully when the
        # sibling is absent. continue-on-error keeps the job alive so the
        # parser/fixtures/hecksagon/world parity suites + cargo tests run.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: chrisyoung/miette
          path: miette

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: hecks
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            hecks/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('hecks/rust/Cargo.lock', 'hecks/rust/Cargo.toml') }}

      - name: Build storehouse (release)
        working-directory: hecks/rust
        run: cargo build --release --quiet

      - name: Cargo tests (incl. conceiver_parity_test)
        working-directory: hecks/rust
        run: cargo test --release --quiet

      - name: Run parser parity suite (Ruby DSL ↔ Rust IR)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/parity_test.rb

      - name: Run behaviors-runner parity suite (Ruby ↔ Rust)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/behaviors_parity_test.rb

      - name: Run fixtures parity suite (Ruby ↔ Rust)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/fixtures_parity_test.rb

      - name: Run fixtures auto-load parity suite (Ruby ↔ Rust)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/fixtures_auto_load_parity_test.rb

      - name: Run hecksagon parity suite (Ruby ↔ Rust)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/hecksagon_parity_test.rb

      - name: Run world parity suite (Ruby ↔ Rust)
        working-directory: hecks
        run: bundle exec ruby -Ilib parity/world_parity_test.rb

      - name: Lifecycle validator across all bluebooks
        working-directory: hecks
        run: |
          BAD=""
          for f in $(find hecks_conception -name "*.bluebook" \
                        ! -name "*_behavioral_tests.bluebook"); do
            if ! rust/target/release/storehouse check-lifecycle "$f" >/dev/null 2>&1; then
              BAD="$BAD\n  $f"
            fi
          done
          if [ -n "$BAD" ]; then
            echo "::error::Lifecycle validator found unreachable transitions:"
            printf "$BAD\n"
            exit 1
          fi
          echo "All bluebooks pass check-lifecycle"

      - name: Behavioral test corpus sweep (must be 100%)
        working-directory: hecks
        run: |
          BIN=rust/target/release/storehouse
          tot_pass=0; tot_fail=0; tot_err=0
          for tf in $(find hecks_conception -name "*_behavioral_tests.bluebook"); do
            out=$($BIN behaviors "$tf" 2>&1 | tail -1)
            pass=$(echo "$out" | grep -oE '[0-9]+ passed' | grep -oE '[0-9]+' || echo 0)
            fail=$(echo "$out" | grep -oE '[0-9]+ failed' | grep -oE '[0-9]+' || echo 0)
            err=$(echo "$out"  | grep -oE '[0-9]+ errored' | grep -oE '[0-9]+' || echo 0)
            tot_pass=$((tot_pass + ${pass:-0}))
            tot_fail=$((tot_fail + ${fail:-0}))
            tot_err=$((tot_err  + ${err:-0}))
          done
          echo "TOTAL: $tot_pass passed, $tot_fail failed, $tot_err errored"
          if [ "$tot_fail" -ne 0 ] || [ "$tot_err" -ne 0 ]; then
            echo "::error::Behavioral test corpus regressed — run storehouse behaviors locally"
            exit 1
          fi
