name: Parity
# [antibody-exempt: .github/workflows/parity.yml — CI workflow config, not
#  bluebook vocabulary ; no .hecksagon-driven CI generator exists yet, so the
#  validate gate is hardcoded YAML. Same basis as ratchet.yml.]
#
# What is left of the old Ruby DSL ↔ Rust storehouse parity job: the
# per-root validate sweep, run on the Ruby runtime over the published
# `hecks` gem. The Rust storehouse build, its cargo test sweep, and the
# private hecks-hecksagain fork checkout they needed are gone. The playground
# no longer depends on that fork.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "**"]

jobs:
  parity:
    name: hecksagain-cli validate (per-root)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hecks_playground
        uses: actions/checkout@v4
        with:
          path: hecks_playground

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          working-directory: hecks_playground
          bundler-cache: true

      - name: hecksagain-cli validate (per-root)
        # HecksagainRuntime::ValidateSweep (i745, Phase 1b) sweeps every
        # domain root individually and reports which ones are invalid, not
        # just a combined pass/fail -- a single combined boot can silently
        # hide a broken root behind a name collision another root's boot
        # happens to survive.
        working-directory: hecks_playground
        run: |
          out=$(bundle exec ruby -Ihecksagain_runtime/lib -r hecksagain_runtime -e 'require "json"; puts JSON.generate(HecksagainRuntime.validate("hecks_playground_conception"))')
          echo "$out"
          ok=$(printf '%s' "$out" | ruby -rjson -e 'puts (JSON.parse(STDIN.read)["ok"] == true) rescue puts "false"')
          invalid=$(printf '%s' "$out" | ruby -rjson -e 'j=JSON.parse(STDIN.read); puts j["invalid"] || 1')
          if [ "$ok" != "true" ] || [ "$invalid" != "0" ]; then
            echo "::error::hecksagain-cli validate found $invalid invalid root(s)"
            exit 1
          fi
          echo "validate: all domain roots clean"
