name: LoC Ratchet

# [antibody-exempt: .github/workflows/ratchet.yml — CI surface
#  for the LoC ratchet ; pairs with bin/loc-ratchet. Workflow YAML
#  is structural infrastructure, not a bluebook concept. Retires
#  when GitHub Actions itself becomes bluebook-driven.]
#
# Fails when a PR increases the count of non-bluebook LoC (*.rs under
# rust/src/, *.sh under hecks_playground_conception/) without a signed
# [loc-ratchet-override: ...] commit marker. The discipline matches
# the antibody-exemption signing rule — only the operator authorises
# increases. See bin/loc-ratchet and inbox i62 / i65 / i66.

on:
  pull_request:
    branches: ["**"]

jobs:
  ratchet:
    name: Non-bluebook LoC may not increase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      # No storehouse binary is built here. bin/loc-ratchet's
      # `storehouse is-dispatched` / `dump-fixtures` queries used to come
      # from the private hecks-hecksagain fork's Rust storehouse; the playground
      # no longer depends on that fork. Without a binary, loc-ratchet uses
      # its built-in `fallback` (hard-coded concerns, every file counts),
      # which over-reports rather than under-reports.
      - name: Run loc-ratchet
        run: bin/loc-ratchet --base "origin/${{ github.base_ref }}" --verbose
