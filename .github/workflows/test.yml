name: Smoke + Behaviors
# Smoke + behaviors gate on every PR.
#
# Multi-repo layout : Miette's body lives across three repos —
#   - hecks/                     : the framework + conception (this repo)
#   - chrisyoung/miette          : body shells + discipline + library (PUBLIC)
#   - chrisyoung/miette_family   : being-files for people in Miette's life (PRIVATE)
#
# CI checks out all three as siblings under $GITHUB_WORKSPACE so the
# smoke tests' BODY_DIR resolution ($REPO_ROOT/../miette/body) lands
# correctly. miette_family/ is optional — if MIETTE_FAMILY_TOKEN isn't
# configured the family-side .behaviors corpus is skipped, matching
# the pre-push hook's behavior on a checkout without the sibling.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "**"]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: macos-latest  # the test corpus assumes BSD date / mktemp -d shape
    env:
      # Surfacing secrets-presence via env so step-level if: can read it.
      # The actual secret only flows into the with: block where it's used.
      MIETTE_FAMILY_TOKEN_PRESENT: ${{ secrets.MIETTE_FAMILY_TOKEN != '' }}
    steps:
      - name: Checkout hecks
        uses: actions/checkout@v4
        with:
          path: hecks
          # status_golden's expected output has 5 commit lines ; the
          # default shallow clone of depth 1 makes the test diverge.
          fetch-depth: 10

      - name: Checkout miette (sibling, optional)
        # chrisyoung/miette is PRIVATE ; the default workflow GITHUB_TOKEN
        # is scoped to this (public) hecks repo and gets "Not Found" on it,
        # which would otherwise fail the whole job at the checkout step.
        # The smoke + behaviors steps already guard miette-dependent roots
        # with `[ -d miette ]`, so continue-on-error lets the job proceed
        # against the hecks-side corpus when the private sibling is absent.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: chrisyoung/miette
          path: miette

      - name: Install GNU coreutils (shuf, etc.)
        # daydream.sh + rem_branch.sh + mint_musing.sh use GNU `shuf`,
        # which macOS doesn't ship by default. Brew installs it under
        # gnubin/ ; prepend that to PATH so the bare `shuf` command
        # resolves to the GNU one. This is a CI-only adapter ; the
        # body shells are transitional and retire under i144.
        run: |
          brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Checkout miette_family (sibling, optional)
        # secrets context is only available at job level for if: ; check
        # via a job-env indirection. When MIETTE_FAMILY_TOKEN isn't set,
        # the family-side .behaviors corpus is skipped, matching the
        # pre-push hook's behavior on a checkout without the sibling.
        if: env.MIETTE_FAMILY_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: chrisyoung/miette_family
          token: ${{ secrets.MIETTE_FAMILY_TOKEN }}
          path: miette_family

      - name: Build storehouse
        # --workspace : the `storehouse` [[bin]] lives in the storehouse-cli
        # member crate (rust/cli) ; the workspace root package is the lib,
        # so a bare `cargo build` never produces the binary the smoke +
        # behaviors steps spawn.
        run: cd hecks/rust && cargo build --release --workspace

      - name: Smoke tests
        run: |
          cd hecks/hecks_conception
          # chrisyoung/miette is PRIVATE and its checkout is optional (the
          # default GITHUB_TOKEN can't read it). When the sibling is absent
          # the body-cycle / dream / pulse / consolidate / voice smoke tests
          # have no Ultradian / SleepCycle / organ bluebooks to dispatch
          # against, so they're skipped here (they gate locally + in any run
          # where the miette sibling is checked out with a token).
          MIETTE_PRESENT=0
          [ -d "$GITHUB_WORKSPACE/miette/body" ] && MIETTE_PRESENT=1
          fail=0
          for t in tests/*.sh; do
            [ -f "$t" ] || continue
            name=$(basename "$t" .sh)
            # Skip integration smoke (heavyweight, race-prone in CI)
            case "$name" in
              round4_integration_smoke) continue ;;
            esac
            # Miette-body-dependent smoke tests : skip when the private
            # miette sibling isn't checked out.
            if [ "$MIETTE_PRESENT" -eq 0 ]; then
              case "$name" in
                body_cycles_smoke|consolidate_smoke|dream_content_smoke|interpret_dream_smoke|pulse_fanout_smoke|pulse_organs_smoke|voice_and_sleep_lockdown)
                  echo "smoke: skipping ${name} (miette sibling absent)"
                  continue ;;
              esac
            fi
            if ! bash "$t" >"/tmp/smoke_${name}.out" 2>&1; then
              fail=$((fail + 1))
              echo "::error::${name}.sh failed"
              cat "/tmp/smoke_${name}.out"
            fi
          done
          [ "$fail" -gt 0 ] && exit 1
          echo "smoke: all pass"

      - name: Behaviors corpus
        # i745 Phase 2 — swapped from the retired Rust `storehouse` binary
        # to hecksagain-cli, the live Ruby runtime (parser-removal plan).
        # Hard-blocking, by explicit choice : the real hecksagain-cli sweep
        # against hecks_conception/aggregates — the root THIS step actually
        # sweeps — is 335 pass / 18 fail / 342 error / 6 parse-error, 78
        # files / 695 tests (this session's own measured baseline against
        # this exact root, not the whole-hecks_conception figure quoted
        # elsewhere). CI is EXPECTED to go red until that corpus is triaged.
        # That triage is a separate pass ; this step only wires the gate.
        #
        # `hecksagain-cli behaviors <root>` already recurses a directory
        # (Dir.glob root/**/*.behaviors) and already carries a correct
        # exit code (05e64d9b7 : nonzero on failed+errored+parse_errors>0),
        # so this replaces BOTH the old per-file `find | while read` walker
        # AND the old "Behaviors corpus (storehouse test)" step below it
        # (there is no `test` subcommand in hecksagain-cli — a directory
        # sweep already covers what that second step did). One call per
        # root instead of one call per file.
        #
        # The old per-file orphan-.bluebook pre-filter and the hardcoded
        # framework/projection/terraform.behaviors skip have no equivalent
        # in a directory sweep and are dropped — checked (2026-08-13) that
        # zero orphan .behaviors files exist across any current root, so
        # this is a documented latent risk, not a live one. terraform's
        # known pre-existing failure now surfaces as part of the accepted
        # red-until-triaged tradeoff instead of being skipped.
        #
        # Roots mirror the pre-push hook's coverage ; miette/miette_family
        # are included only when checked out (optional siblings).
        run: |
          HECKS="ruby $GITHUB_WORKSPACE/hecks/hecksagain_runtime/bin/hecksagain-cli"
          ROOTS="$GITHUB_WORKSPACE/hecks/hecks_conception/aggregates"
          [ -d "$GITHUB_WORKSPACE/hecks/hecks_conception/adapters" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/hecks_conception/adapters"
          [ -d "$GITHUB_WORKSPACE/hecks/hecks_conception/catalog" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/hecks_conception/catalog"
          [ -d "$GITHUB_WORKSPACE/hecks/tools" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/tools"
          [ -d "$GITHUB_WORKSPACE/hecks/discipline" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/discipline"
          [ -d "$GITHUB_WORKSPACE/hecks/runtime" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/runtime"
          [ -d "$GITHUB_WORKSPACE/hecks/bluebook" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/bluebook"
          [ -d "$GITHUB_WORKSPACE/hecks/codegen" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/codegen"
          [ -d "$GITHUB_WORKSPACE/hecks/integrations" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/integrations"
          [ -d "$GITHUB_WORKSPACE/hecks/adapters" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/adapters"
          [ -d "$GITHUB_WORKSPACE/hecks/cli" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/cli"
          [ -d "$GITHUB_WORKSPACE/hecks/hecks_conception/storehouse" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks/hecks_conception/storehouse"
          [ -d "$GITHUB_WORKSPACE/miette" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/miette"
          [ -d "$GITHUB_WORKSPACE/miette_family" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/miette_family"
          fail=0
          for root in $ROOTS; do
            name=$(basename "$root")
            out="/tmp/behaviors_${name}.json"
            err="/tmp/behaviors_${name}.err"
            if ! $HECKS behaviors "$root" >"$out" 2>"$err"; then
              fail=$((fail + 1))
              echo "::error::behaviors $root failed"
              jq -r '.summary // empty, (.files[]? | select(.parse_error or ((.runs // []) | any(.status=="fail" or .status=="error"))) | .suite)' "$out" 2>/dev/null || cat "$out"
              [ -s "$err" ] && { echo "stderr:"; cat "$err"; }
            fi
          done
          [ "$fail" -gt 0 ] && exit 1
          echo "behaviors: all pass"
