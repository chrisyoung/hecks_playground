name: Behaviors
# Behaviors gate on every PR.
#
# Multi-repo layout : Miette's body + engine live across three repos —
#   - hecks_playground/                     : the framework + conception (this repo)
#   - chrisyoung/miette          : body shells + discipline + library (PRIVATE)
#   - chrisyoung/miette_family   : being-files for people in Miette's life (PRIVATE)
#
# CI checks out the optional siblings under $GITHUB_WORKSPACE when it can.
# miette_family/ is optional — if MIETTE_FAMILY_TOKEN isn't configured the
# family-side .behaviors corpus is skipped, matching a local checkout
# without the sibling.
#
# This workflow used to be "Smoke + Behaviors". The smoke step ran
# hecks_playground_conception/tests/*.sh, and every one of those scripts
# shells the Rust `storehouse` binary, which CI built from the private
# hecks-hecksagain fork. The playground no longer depends on that fork, so
# the fork checkout, the storehouse build, and the smoke step are gone. The
# scripts themselves stay in the tree; nothing in CI runs them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "**"]
  workflow_dispatch:

jobs:
  behaviors:
    runs-on: macos-latest
    env:
      # Surfacing secrets-presence via env so step-level if: can read it.
      # The actual secret only flows into the with: block where it's used.
      MIETTE_FAMILY_TOKEN_PRESENT: ${{ secrets.MIETTE_FAMILY_TOKEN != '' }}
    steps:
      - name: Checkout hecks_playground
        uses: actions/checkout@v4
        with:
          path: hecks_playground

      - name: Checkout miette (sibling, optional)
        # chrisyoung/miette is PRIVATE ; the default workflow GITHUB_TOKEN
        # is scoped to this (public) hecks_playground repo and gets "Not Found" on it,
        # which would otherwise fail the whole job at the checkout step.
        # The behaviors step guards the miette root with `[ -d miette ]`,
        # so continue-on-error lets the job proceed against the
        # hecks_playground-side corpus when the private sibling is absent.
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: chrisyoung/miette
          path: miette

      - name: Checkout miette_family (sibling, optional)
        # secrets context is only available at job level for if: ; check
        # via a job-env indirection. When MIETTE_FAMILY_TOKEN isn't set,
        # the family-side .behaviors corpus is skipped.
        if: env.MIETTE_FAMILY_TOKEN_PRESENT == 'true'
        uses: actions/checkout@v4
        with:
          repository: chrisyoung/miette_family
          token: ${{ secrets.MIETTE_FAMILY_TOKEN }}
          path: miette_family

      - uses: ruby/setup-ruby@v1
        # hecksagain-cli does `require "bundler/setup"` against
        # hecks_playground's Gemfile (the published `hecks` gem), so the
        # bundle has to be installed before the behaviors sweep can boot.
        with:
          ruby-version: "3.3"
          working-directory: hecks_playground
          bundler-cache: true

      - name: Behaviors corpus
        # i745 Phase 2 — runs hecksagain-cli, the live Ruby runtime, not the
        # retired Rust `storehouse` binary (parser-removal plan).
        # Hard-blocking, by explicit choice. CI is EXPECTED to go red until
        # the corpus is triaged ; that triage is a separate pass, this step
        # only wires the gate.
        #
        # MEASURED BASELINE, all roots this step sweeps in a checkout
        # WITHOUT the optional miette/miette_family siblings (2026-09-18,
        # hecks 1.3.0, after the behaviors-runner fix) :
        #   102 files · 1050 tests · 280 pass / 13 fail / 756 error
        #   / 1 pending / 6 parse-error
        # The previous figure quoted here (335 pass / 18 fail / 342 error,
        # 695 tests) was measured against the retired VENDORED hecksagain
        # and no longer describes anything runnable — between then and now
        # the runner called `Hecksagain.last_behaviors_suite`, a constant
        # the published gem never defines, so every file reported a parse
        # error and the real number of tests executed was ZERO.
        #
        # The three big remaining buckets, all corpus-side, none of them
        # the runner :
        #   • integrations/ (94) + discipline/ (21) — every test errors at
        #     BOOT on `aggregate "Name", "description"`, the pre-1.3.0
        #     two-positional-arg form. The gem-migration PR (#781) migrated
        #     hecks_playground_conception only ; these roots were never done.
        #   • 6 parse errors — `expect_event`, a `.behaviors` word no
        #     runner here has ever implemented (the same 6 files were
        #     parse errors under the vendored runtime too).
        #   • the rest — stale `expect refused:` wording, tests that
        #     assume state seeded by an earlier test, and cascades whose
        #     `driven on` adapters PR #781 parked in .drivers files.
        #
        # `hecksagain-cli behaviors <root>` already recurses a directory
        # (Dir.glob root/**/*.behaviors) and already carries a correct
        # exit code (05e64d9b7 : nonzero on failed+errored+parse_errors>0),
        # so one call per root covers what the old per-file walker and the
        # old "Behaviors corpus (storehouse test)" step did.
        #
        # The old per-file orphan-.bluebook pre-filter and the hardcoded
        # framework/projection/terraform.behaviors skip have no equivalent
        # in a directory sweep and are dropped — checked (2026-08-13) that
        # zero orphan .behaviors files exist across any current root, so
        # this is a documented latent risk, not a live one. terraform's
        # known pre-existing failure now surfaces as part of the accepted
        # red-until-triaged tradeoff instead of being skipped.
        #
        # miette/miette_family are included only when checked out
        # (optional siblings).
        run: |
          HECKS_PLAYGROUND="ruby $GITHUB_WORKSPACE/hecks_playground/hecksagain_runtime/bin/hecksagain-cli"
          ROOTS="$GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/aggregates"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/adapters" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/adapters"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/catalog" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/catalog"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/tools" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/tools"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/discipline" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/discipline"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/runtime" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/runtime"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/bluebook" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/bluebook"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/codegen" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/codegen"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/integrations" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/integrations"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/adapters" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/adapters"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/cli" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/cli"
          [ -d "$GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/storehouse" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/hecks_playground/hecks_playground_conception/storehouse"
          [ -d "$GITHUB_WORKSPACE/miette" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/miette"
          [ -d "$GITHUB_WORKSPACE/miette_family" ] && ROOTS="$ROOTS $GITHUB_WORKSPACE/miette_family"
          fail=0
          for root in $ROOTS; do
            name=$(basename "$root")
            out="/tmp/behaviors_${name}.json"
            err="/tmp/behaviors_${name}.err"
            if ! $HECKS_PLAYGROUND behaviors "$root" >"$out" 2>"$err"; then
              fail=$((fail + 1))
              echo "::error::behaviors $root failed"
              jq -r '.summary // empty, (.files[]? | select(.parse_error or ((.runs // []) | any(.status=="fail" or .status=="error"))) | .suite)' "$out" 2>/dev/null || cat "$out"
              [ -s "$err" ] && { echo "stderr:"; cat "$err"; }
            fi
          done
          [ "$fail" -gt 0 ] && exit 1
          echo "behaviors: all pass"
