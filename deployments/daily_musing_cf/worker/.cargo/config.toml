# hecks-hecksagain (the fork this worker now git-deps its `storehouse`
# crate on) is a PRIVATE GitHub repo. Cargo's built-in libgit2 transport
# can't authenticate against it (fails with "failed to acquire
# username/password from local configuration") even though the system
# `git` CLI clones it fine via the developer's existing SSH/HTTPS
# credentials. Forcing Cargo to shell out to the system `git` CLI for
# all git-sourced dependencies fixes this. Discovered + required during
# i768 slice 2.2 (hecksagain storehouse cutover verification) once the
# worker's `storehouse` dep became git-sourced instead of a local
# path-dep.
[net]
git-fetch-with-cli = true
