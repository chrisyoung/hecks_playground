# DERIVED from ../cloudflare.bluebook (the WorkerConfig fixture)
# by `storehouse specialize wrangler_toml`. The bluebook is the
# source of truth ; this file is the artifact. Do not hand-edit —
# change the fixture and regenerate.

name               = "daily-musing-worker"
main               = "build/worker/shim.mjs"
compatibility_date = "2026-05-10"

# heki -> R2 persistence binding. lib.rs reads this binding by
# name to hydrate state on boot and persist every dispatch back.
[[r2_buckets]]
binding     = "DAILY_MUSING_R2_BUCKET"
bucket_name = "daily-musing-heki"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true
