# DERIVED from ../cloudflare.bluebook — the ESTABLISHED WorkerConfig
# record — by `storehouse project wrangler`. The bluebook declares, the
# BootCompleted establishment policy asserts the record, this artifact
# projects from the record. Do not hand-edit — change the policy and
# re-project.

name               = "daily-musing-worker"
main               = "build/worker/shim.mjs"
compatibility_date = "2026-05-10"

# heki -> R2 persistence binding. lib.rs reads this binding by
# name to hydrate state on boot and persist every dispatch back.
[[r2_buckets]]
binding     = "DAILY_MUSING_R2_BUCKET"
bucket_name = "daily-musing-heki"

[build]
command = "cargo install -q worker-build && worker-build --release"

[observability]
enabled = true
