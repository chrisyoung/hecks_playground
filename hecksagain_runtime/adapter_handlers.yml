# Adapter name -> the executable bin/adapter-host runs for it.
# Lives here, not in each .adapter file: hecks 1.3.0's adapter DSL has no
# `handler` word (only port/field/secret), and this is playground runtime
# config, not domain declaration. Read by HecksagainRuntime.adapter_handler.
