[package]
name = "storehouse"
version = "0.1.0"
edition = "2021"
description = "Bluebook compiler — reads domain declarations, emits any target"

[dependencies]
flate2 = "1"
serde_json = "1"

# rusqlite — the SQLite-backed repository (rust/src/runtime/sqlite_*.rs).
# Host-only : `bundled` compiles C SQLite, which has no
# wasm32-unknown-unknown target, so the dep is gated to non-wasm.
# Inside the Cloudflare Worker the runtime uses the in-memory
# repository (and, later, the R2 heki adapter) ; sqlite_repository.rs
# + sqlite_mapping.rs are correspondingly cfg-gated out in lib.rs /
# runtime/mod.rs.
#
# tokio — async substrate for the actor model (sprint-14
# tokio-mailbox-substrate). Replaces the std::thread-per-mailbox
# substrate PR #702 landed ; mailbox abstraction unchanged. Full
# features for now ; trim later via a feature-flag audit card.
# Host-only for the same reason as rusqlite — the actor module is
# cfg-gated out on wasm32 (see runtime/mod.rs) so the wasm build does
# not pull tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }

# wasm32-only : the Cloudflare Worker R2 binding. Used by
# rust/src/heki_r2.rs (cfg-gated to target_arch = "wasm32") for the
# i528 R2 storage adapter. The host CLI never compiles this dep —
# inside bin-buddy-worker's wasm32 build, the path-dep on storehouse
# resolves it and heki_r2 becomes reachable. See heki_r2.rs for
# the contract.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.3"
# getrandom with the `js` feature routes through the JS
# crypto.getRandomValues primitive on wasm32-unknown-unknown, so
# heki::uuid_v4() gets crypto-grade entropy inside the CF Worker
# instead of falling back to time-seeded bytes.
getrandom = { version = "0.2", features = ["js"] }
