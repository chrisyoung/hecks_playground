[package]
name = "storehouse"
version = "0.1.0"
edition = "2021"
description = "Bluebook compiler — reads domain declarations, emits any target"

[dependencies]
flate2 = "1"
serde_json = "1"

# regex — enforces a declared `pattern:` at the payload gate. The SEVENTH
# dependency in a deliberately lean crate, so it earns its place explicitly :
# a pattern the form shows but the door does not enforce is a lie, and the
# only alternative was hand-rolling a matcher whose semantics would drift from
# both Ruby's Regexp and the browser's. `default-features = false` with just
# `std` + `unicode-perl` keeps it small — no fancy Unicode tables we never use.
# Ships to wasm too : the gate must refuse identically wherever it runs.
# What a bluebook may DECLARE is narrowed to the Ruby-Rust intersection by
# `pattern_subset`, so this engine never sees a construct Ruby would read
# differently.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }

# tokio — async substrate for the actor model (sprint-14
# tokio-mailbox-substrate). Replaces the std::thread-per-mailbox
# substrate PR #702 landed ; mailbox abstraction unchanged. Full
# features for now ; trim later via a feature-flag audit card.
# Host-only for the same reason as rusqlite — the actor module is
# cfg-gated out on wasm32 (see runtime/mod.rs) so the wasm build does
# not pull tokio.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["full"] }

# wasm32-only : the Cloudflare Worker R2 binding. Used by
# rust/src/heki_r2.rs (cfg-gated to target_arch = "wasm32") for the
# i528 R2 storage adapter. The host CLI never compiles this dep —
# inside bin-buddy-worker's wasm32 build, the path-dep on storehouse
# resolves it and heki_r2 becomes reachable. See heki_r2.rs for
# the contract.
[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "0.8.3"
# getrandom with the `js` feature routes through the JS
# crypto.getRandomValues primitive on wasm32-unknown-unknown, so
# heki::uuid_v4() gets crypto-grade entropy inside the CF Worker
# instead of falling back to time-seeded bytes.
getrandom = { version = "0.2", features = ["js"] }

[workspace]
members = ["sqlite", "cli"]
# ruby_ext is a PROJECTION TARGET, not a workspace member : building it needs
# ruby dev headers (rb-sys/magnus), which the CI gates must never require.
# It is built only by bin/project-storehouse. See rust/ruby_ext/Cargo.toml.
exclude = ["ruby_ext"]
