[package]
name = "storehouse-cli"
version = "0.1.0"
edition = "2021"
description = "storehouse CLI — the composition root. Wires concrete adapters (sqlite, ...) into the runtime and exposes the storehouse command surface. The binary is named `storehouse`."

[[bin]]
name = "storehouse"
path = "src/main.rs"

[dependencies]
# The generic runtime carries NO impure persistence adapter — not even as an
# optional feature. It links only the in-process heki / memory substrate the
# kernel always has. A heavy or native-dependency adapter (storehouse-sqlite ->
# rusqlite -> C SQLite) is hooked up by a PROJECT's own composition root, which
# depends on the adapter crate and calls `storehouse_sqlite::register()` before
# boot (see sqlite/tests/sqlite_scope_test.rs). Keeping it out of here is what
# makes "you cannot run sqlite through the generic runtime" true by construction.
storehouse = { path = ".." }
serde_json = "1"
