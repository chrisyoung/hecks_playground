# storehouse_rb — the magnus cdylib PROJECTION TARGET.
#
# Deliberately EXCLUDED from the rust/ workspace (rust/Cargo.toml
# workspace.exclude) : building it needs ruby dev headers via rb-sys, and the
# CI gates (`cargo build --workspace`) must stay ruby-free. It is built ONLY
# by bin/project-storehouse, which drops the compiled .bundle into a consumer
# app's vendor/storehouse/ — the app never sees this source, only the artifact.
[package]
name = "storehouse_rb"
version = "0.1.0"
edition = "2021"
description = "In-process Ruby -> Rust binding to storehouse::embed (magnus cdylib), sqlite registered."

[lib]
# The lib name MUST stay storehouse_rb — magnus emits Init_storehouse_rb and
# Ruby's require resolves the .bundle by that symbol.
name = "storehouse_rb"
crate-type = ["cdylib"]

[dependencies]
magnus = "0.7"
storehouse = { path = ".." }
storehouse-sqlite = { path = "../sqlite" }
serde_json = "1"
