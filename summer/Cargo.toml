[package]
name = "summer"
version = "0.2.0"
edition = "2021"
description = "Spring — the universal domain command line"

[dependencies]
# Git-sourced dependency on the storehouse fork -- mirrors
# deployments/daily_musing_cf/worker/Cargo.toml's cutover (i768 slice
# 2.2) so both the worker and this CLI resolve the SAME fork commit
# the same way : pinned via an explicit `rev:` (not a floating
# `branch:`), reproducible, no manual local checkout required. Cargo
# auto-discovers the `storehouse` crate inside the cloned repo (it
# isn't at the repo root) purely by matching [package] name -- no
# `path =` needed alongside `git =`. Bump the `rev` explicitly (new
# commit + `cargo update -p storehouse`) to pick up fork changes, same
# discipline as the worker's Cargo.toml and the Gemfile's `ref:` bump.
# Was `path = "../rust"` (hecks's own vendored copy) before i768 slice
# 2.2b ; verified with a real `cargo build` + `summer exec` run against
# a real domain as part of that cutover. hecks-hecksagain is a PRIVATE
# repo -- see summer/.cargo/config.toml for the `git-fetch-with-cli`
# fix this dependency needs to authenticate.
storehouse = { git = "https://github.com/chrisyoung/hecks-hecksagain", rev = "77fdc103f8d1ded56cc6e69369fd688e0ce4be1a", default-features = false }
serde_json = "1"
libc = "0.2"
